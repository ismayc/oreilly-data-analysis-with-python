name: Render solutions HTML

# Render exercises_solutions.qmd to a self-contained exercises_solutions.html and commit
# it, so Netlify (linked to this repo's main branch) serves a current copy. Rendering
# EXECUTES the notebook, so it runs in CI for a consistent result across courses rather
# than depending on whoever last rendered locally.

on:
  push:
    branches: [main]
    paths:
      - 'exercises_solutions.qmd'
      - 'requirements.txt'
      # Explicit data filenames. A bare '*.csv' / '*.xlsx' did NOT fire for the
      # 2026-08-26 dataset rebuild: the push changed five root-level data files
      # and GitHub created zero runs, leaving the published HTML stale while the
      # repo carried new data. Naming them removes the guesswork.
      - 'economies.csv'
      - 'economies_indexed.csv'
      - 'populations.csv'
      - 'economies.xlsx'
      - 'populations.xlsx'
      - '.github/workflows/render-solutions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # SHARED with the other auto-committing workflow: both push to main, and when
  # they overlap the loser cannot rebase a generated file. Queue instead of racing,
  # and never cancel, or a queued run's output is lost.
  group: main-autocommit
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jupyter ipykernel nbclient nbformat
          python -m ipykernel install --user --name python3

      - name: Render solutions to HTML (executes the notebook)
        env:
          QUARTO_PYTHON: python3
        run: quarto render exercises_solutions.qmd --to html

      - name: Commit & push solutions HTML if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # exercises_solutions.html is generated, so a rebase against a concurrent auto-commit can
          # only conflict. Replay it onto the latest main instead of merging.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet origin/main
            git add -f exercises_solutions.html
            # embed-resources makes the HTML self-contained; drop any stale figure dir
            git rm -r --cached --ignore-unmatch exercises_solutions_files >/dev/null 2>&1 || true
            if git diff --cached --quiet; then
              echo "exercises_solutions.html already up to date - nothing to push."
              exit 0
            fi
            git commit -q -m "Auto-render solutions HTML [skip actions]"
            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), refreshing and retrying"
          done
          echo "could not push exercises_solutions.html after 3 attempts" >&2
          exit 1
