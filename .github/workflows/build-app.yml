name: Rebuild browser apps

# Rebuild the Quarto Live + JupyterLite sites (committed under app/) whenever the
# source notebooks change. Netlify then auto-deploys the updated app/ from main.

on:
  push:
    branches: [main]
    paths:
      - 'exercises.qmd'
      - 'exercises_solutions.qmd'
      - 'economies.csv'
      - 'economies_indexed.csv'
      - 'populations.csv'
      - 'economies.xlsx'
      - 'populations.xlsx'
      - 'scripts/**'
      - 'live/_quarto.yml'
      - 'live/index.qmd'
      - 'live/_extensions/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # SHARED with the other auto-committing workflow: both push to main, and when
  # they overlap the loser cannot rebase a generated file. Queue instead of racing,
  # and never cancel, or a queued run's output is lost.
  group: main-autocommit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build app/ (Quarto Live + JupyterLite)
        run: bash scripts/build-app.sh

      - name: Commit & push updated app/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # app is generated, so a rebase against a concurrent auto-commit can
          # only conflict. Replay it onto the latest main instead of merging.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet origin/main
            git add -f app
            if git diff --cached --quiet; then
              echo "app already up to date - nothing to push."
              exit 0
            fi
            git commit -q -m "Auto-rebuild browser apps from notebook changes [skip actions]"
            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), refreshing and retrying"
          done
          echo "could not push app after 3 attempts" >&2
          exit 1
